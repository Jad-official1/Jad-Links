<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Links - @Jad_official1</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Script Config / Style Settings */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Theme: Blue Gradient */
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .profile-container {
            margin-bottom: 25px;
        }

        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #38bdf8;
            object-fit: cover;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 24px;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .handle {
            font-size: 15px;
            color: #38bdf8;
            font-weight: 600;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 15px 25px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(0, 0, 0, 0.4);
        }

        .btn i {
            font-size: 24px;
        }

        /* SVG Roblox Icon Style */
        .roblox-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .youtube {
            background-color: #FF0000;
        }

        .discord {
            background-color: #5865F2;
        }

        .instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .tiktok {
            background-color: #000000;
        }

        /* Roblox Blue Button */
        .roblox {
            background-color: #00A2FF;
        }
    </style>
</head>

            <a href="https://discord.gg/tdNPhsXC7" target="_blank" class="btn discord">

            <a href="https://www.instagram.com/alk_om99?stkn=YjFqNDBxcm05N2gy" target="_blank" class="btn instagram">
                <i class="fa-brands fa-instagram"></i>

</html>
